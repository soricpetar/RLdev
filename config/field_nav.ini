[base]
env_name = field_nav fieldnav field-nav
backend = native
device = auto
seed = 0
checkpoint_interval = 20
eval_episodes = 0

[vec]
total_agents = 64
num_buffers = 1
num_threads = 1

[env]
map_size = 64
polar_observation = true
polar_angle_bins = 32
polar_distance_bins = 16
polar_max_distance_m = 24.0
map_extent_m = 12.0
world_size_m = 50.0
max_steps = 400
dt = 0.2
fixed_speed_mps = 1.0
min_speed_mps = 0.0
max_speed_mps = 1.6
acceleration_mps2 = 1.5
brake_deceleration_mps2 = 2.5
coast_deceleration_mps2 = 0.3
max_turn_rate_rps = 1.0
tree_rows_min = 2
tree_rows_max = 4
bushes_min = 6
bushes_max = 14
potholes_min = 4
potholes_max = 10
people_min = 2
people_max = 6
walls_min = 1
walls_max = 4
curriculum_enabled = 0
curriculum_warmup_steps = 0
min_goal_distance_m = 10.0
max_goal_distance_m = 22.0
goal_tolerance_m = 0.65
robot_radius_m = 0.35
inflation_radius_m = 1.0
near_obstacle_threshold_m = 2.0
reset_start_clearance_m = 1.0
reset_goal_clearance_m = 1.0
reset_forward_clearance_m = 1.5
reset_forward_margin_m = 0.25

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1
map_channels = 3
polar_angle_bins = 32
polar_distance_bins = 16

[torch]
network = MLP
encoder = FieldNavPolarEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 0
total_timesteps = 25000000
learning_rate = 0.0003
lr_warmup_steps = 500000
lr_warmup_start_ratio = 0.1
anneal_lr = 1
min_lr_ratio = 0.3
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 2.0
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.015
beta1 = 0.95
beta2 = 0.999
eps = 1e-8
minibatch_size = 6144
horizon = 192
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0

[sweep]
method = Protein
metric = score
downsample = 5
