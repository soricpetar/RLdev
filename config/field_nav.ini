[base]
env_name = field_nav fieldnav field-nav
backend = native
device = auto
seed = 0
checkpoint_interval = 20
eval_episodes = 100

[vec]
total_agents = 16
num_buffers = 1
num_threads = 1

[env]
map_size = 64
map_extent_m = 12.0
world_size_m = 50.0
max_steps = 400
dt = 0.2
fixed_speed_mps = 1.0
max_turn_rate_rps = 1.0
tree_rows_min = 2
tree_rows_max = 4
bushes_min = 6
bushes_max = 14
potholes_min = 4
potholes_max = 10
people_min = 2
people_max = 6
walls_min = 1
walls_max = 4
min_goal_distance_m = 10.0
max_goal_distance_m = 22.0
goal_tolerance_m = 0.65
robot_radius_m = 0.35
inflation_radius_m = 1.0
near_obstacle_threshold_m = 2.0

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1
map_channels = 5
map_size = 64

[torch]
network = MLP
encoder = FieldNavEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 0
total_timesteps = 491520
learning_rate = 0.0003
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 4.0
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.95
beta2 = 0.999
eps = 1e-8
minibatch_size = 3072
horizon = 192
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0

[sweep]
method = Protein
metric = score
downsample = 5
