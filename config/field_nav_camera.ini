[base]
env_name = field_nav_camera fieldnav-camera
backend = python
device = auto
seed = 100
checkpoint_interval = 10
eval_episodes = 0

[vec]
total_agents = 64
num_buffers = 1
num_threads = 1

[env]
front_camera_observation = true
front_camera_fov_deg = 100.0
polar_angle_bins = 32
polar_distance_bins = 16
polar_max_distance_m = 24.0
map_size = 64
map_extent_m = 12.0
world_size_m = 50.0
max_steps = 500
dt = 0.2
fixed_speed_mps = 1.0
speed_control = true
min_speed_mps = 0.0
max_speed_mps = 1.2
acceleration_mps2 = 1.5
brake_deceleration_mps2 = 2.5
coast_deceleration_mps2 = 0.3
max_turn_rate_rps = 1.0
tree_rows_range = (1, 2)
bushes_range = (3, 8)
potholes_range = (1, 4)
people_range = (0, 2)
walls_range = (0, 1)
curriculum_enabled = true
curriculum_warmup_steps = 500000
min_goal_distance_m = 10.0
max_goal_distance_m = 22.0
goal_tolerance_m = 0.65
robot_radius_m = 0.35
inflation_radius_m = 1.0
near_obstacle_threshold_m = 2.0
reset_start_clearance_m = 1.0
reset_goal_clearance_m = 1.0
reset_forward_clearance_m = 1.5
reset_forward_margin_m = 0.25

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1
map_channels = 4
polar_angle_bins = 32
polar_distance_bins = 16

[torch]
network = MLP
encoder = FieldNavPolarEncoder
decoder = DefaultDecoder

[train]
experiment_name = front_camera_polar_stage1_smoke
experiment_description = Simulated forward-only camera polar costmap. The policy sees 100 degree front FOV rays and an explicit unknown channel for unseen rear/side bins. Stage 1 uses easier obstacle ranges, speed control, reset clearance, and a 500k curriculum warmup.
gpus = 1
seed = 100
total_timesteps = 1000000
learning_rate = 0.0003
lr_warmup_steps = 100000
lr_warmup_start_ratio = 0.1
anneal_lr = 1
min_lr_ratio = 0.3
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 2.0
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.95
beta2 = 0.999
eps = 1e-8
minibatch_size = 6144
horizon = 192
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0

[sweep]
method = Protein
metric = score
downsample = 5
