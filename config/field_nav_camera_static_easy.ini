[base]
env_name = field_nav_camera_static_easy fieldnav-camera-static-easy
backend = python
device = auto
seed = 103
checkpoint_interval = 25
eval_episodes = 0

[vec]
total_agents = 64
num_buffers = 1
num_threads = 1

[env]
front_camera_observation = true
front_camera_fov_deg = 180.0
heading_alignment_scale = 0.10
goal_outside_fov_penalty = 0.02
polar_angle_bins = 32
polar_distance_bins = 16
polar_max_distance_m = 12.0
map_size = 64
map_extent_m = 12.0
world_size_m = 50.0
max_steps = 150
dt = 0.2
fixed_speed_mps = 1.0
speed_control = false
min_speed_mps = 0.0
max_speed_mps = 1.0
acceleration_mps2 = 1.5
brake_deceleration_mps2 = 2.5
coast_deceleration_mps2 = 0.3
max_turn_rate_rps = 1.0
tree_rows_range = (0, 1)
bushes_range = (0, 2)
potholes_range = (0, 1)
people_range = (0, 0)
walls_range = (0, 0)
curriculum_enabled = false
curriculum_warmup_steps = 0
min_goal_distance_m = 3.0
max_goal_distance_m = 6.0
goal_tolerance_m = 0.65
robot_radius_m = 0.35
inflation_radius_m = 1.0
near_obstacle_threshold_m = 2.0
reset_start_clearance_m = 1.0
reset_goal_clearance_m = 1.0
reset_forward_clearance_m = 1.5
reset_forward_margin_m = 0.25

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1
map_channels = 4
polar_angle_bins = 32
polar_distance_bins = 16

[torch]
network = MLP
encoder = FieldNavPolarEncoder
decoder = DefaultDecoder

[train]
experiment_name = front_camera_polar_stage4_static_easy_25m
experiment_description = Fine-tune the successful FC-003 empty-map bootstrap checkpoint on sparse static obstacles. Keeps 180 degree FOV, fixed-speed 5-action steering, short 3-6m goals, no people/walls, and reintroduces sparse bushes, potholes, and optional tree rows.
gpus = 1
seed = 103
total_timesteps = 25000000
learning_rate = 0.00015
lr_warmup_steps = 250000
lr_warmup_start_ratio = 0.1
anneal_lr = 1
min_lr_ratio = 0.3
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 2.0
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.002
beta1 = 0.95
beta2 = 0.999
eps = 1e-8
minibatch_size = 6144
horizon = 192
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0

[sweep]
method = Protein
metric = score
downsample = 5
