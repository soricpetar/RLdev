env:
  map_size: 64
  costmap_channels:
    - hard_static
    - soft_vegetation
    - terrain_hazard
    - dynamic_person
    - wall
  map_extent_m: 12.0
  world_size_m: 50.0
  max_steps: 500
  dt: 0.2
  fixed_speed_mps: 1.0
  max_turn_rate_rps: 1.0
  num_obstacles_range: [14, 40]
  obstacle_radius_range_m: [0.35, 1.6]
  tree_rows_range: [2, 4]
  bushes_range: [6, 14]
  potholes_range: [4, 10]
  people_range: [2, 6]
  walls_range: [1, 4]
  min_goal_distance_m: 10.0
  max_goal_distance_m: 22.0
  goal_tolerance_m: 0.65
  robot_radius_m: 0.35
  inflation_radius_m: 1.0
  near_obstacle_threshold_m: 2.0

reward:
  goal_bonus: 20.0
  collision_penalty: 20.0
  near_obstacle_scale: 0.2
  smoothness_scale: 0.02
  time_penalty: 0.01
  semantic_penalties:
    bush_contact_scale: 0.08
    pothole_contact_scale: 1.25
    person_proximity_scale: 0.35
