env:
  map_size: 64
  map_extent_m: 12.0
  world_size_m: 50.0
  max_steps: 500
  dt: 0.2
  fixed_speed_mps: 1.0
  max_turn_rate_rps: 1.0
  num_obstacles_range: [8, 30]
  goal_tolerance_m: 0.8
  robot_radius_m: 0.35

reward:
  goal_bonus: 20.0
  collision_penalty: 20.0
  near_obstacle_scale: 0.2
  smoothness_scale: 0.02
  time_penalty: 0.01
